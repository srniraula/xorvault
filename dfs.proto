syntax = "proto3";

package dfspb;

option go_package = "dfs-project/dfspb";

message CreateFileRequest {
  string filename = 1;
  int64 total_size = 2;
  int64 client_id = 3;
  string username = 4;
}

message CreateFileResponse {
  bool success = 1;
  int64 client_id = 2;
  map<int32, StripeMetadata> stripes = 3;
}

message AllocateChunkRequest {
  string filename = 1;
  int64 file_size = 2;
}

message ChunkList {
  repeated string chunk_ids = 1;
}

message StripeMetadata {
  int32 stripe_num = 1;
  repeated string chunk_ids = 2;  // [data1, data2, parity]
  repeated string servers = 3;    // [server1, server2, server3]
}

message AllocateChunkResponse {
  map<int32, StripeMetadata> stripes = 1;
}

message GetFileMetadataRequest {
  string filename = 1;
  int64 client_id = 2;
}

message GetFileMetadataResponse {
  map<int32, StripeMetadata> stripes = 1;
  int64 file_size = 2;
}

message WriteChunkRequest {
  string chunk_id = 1;
  bytes data = 2;
  string checksum = 3;
  int64 client_id = 4;
  string username = 5;
}

message WriteChunkResponse {
  bool success = 1;
}

message ReadChunkRequest {
  string chunk_id = 1;
  int64 client_id = 2;
  string username = 3;
}

message ReadChunkResponse {
  bytes data = 1;
  string checksum = 2;
}

message ForwardChunkRequest {
  string chunk_id = 1;
  bytes data = 2;
  repeated string next_locations = 3;
}

message HeartbeatRequest {
  string address = 1;
}

message HeartbeatResponse {
  bool success = 1;
}

message InventoryRequest {
  string address = 1;
  repeated string chunk_ids = 2;  // Chunks this server currently has
}

message ReconstructionTask {
  string chunk_id = 1;              // The missing chunk to reconstruct
  int32 stripe_num = 2;             // Stripe number
  repeated string other_chunk_ids = 3;  // [chunk1, chunk2] - the 2 available chunks
  repeated string other_servers = 4;    // [server1, server2] - where to get them
  int64 client_id = 5;              // Client ID for physical isolation
  string username = 6;              // Username for directory naming
}

message InventoryResponse {
  repeated string missing_chunks = 1;  // Chunks to reconstruct
  repeated string extra_chunks = 2;    // Chunks to delete (orphaned)
  repeated ReconstructionTask reconstruction_tasks = 3;  // How to reconstruct missing chunks
}

message ConfirmWriteRequest {
  string filename = 1;
  repeated string chunk_ids = 2;
}

message ConfirmWriteResponse {
  bool success = 1;
}

message DeleteFileRequest {
  string filename = 1;
  int64 client_id = 2;
}

message DeleteFileResponse {
  bool success = 1;
  string message = 2;
}

message DeleteChunksRequest {
  repeated string chunk_ids = 1;  // All chunks to delete on this server
  int64 client_id = 2;
  string username = 3;
}

message DeleteChunksResponse {
  bool success = 1;
  int32 deleted_count = 2;  // How many chunks were successfully deleted
}

message ListFilesRequest {
  int64 client_id = 1;
}

message ListFilesResponse {
  repeated string filenames = 1;
}

// ─── FOLDER OPERATIONS ───────────────────────────────────────────────────────

message CreateFolderRequest {
  int64  client_id   = 1;
  string folder_path = 2;
}

message CreateFolderResponse {
  bool   success = 1;
  string message = 2;
}

message DeleteFolderRequest {
  int64  client_id   = 1;
  string folder_path = 2;
}

message DeleteFolderResponse {
  bool   success = 1;
  string message = 2;
}

message MoveFileRequest {
  int64  client_id        = 1;
  string source_path      = 2;
  string destination_path = 3;
}

message MoveFileResponse {
  bool   success = 1;
  string message = 2;
}

message FileMetadata {
  string path         = 1;
  int64  size         = 2;
  int64  upload_time  = 3;
  bool   is_directory = 4;
}

message ListFilesDetailedRequest {
  int64  client_id   = 1;
  string folder_path = 2;
}

message ListFilesDetailedResponse {
  repeated FileMetadata items = 1;
}

message ReadFileContentRequest {
  string filename  = 1;
  int64  client_id = 2;
  int64  offset    = 3;
  int64  length    = 4;
}

message ReadFileContentResponse {
  bytes data       = 1;
  int64 total_size = 2;
}

