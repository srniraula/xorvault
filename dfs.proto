syntax = "proto3";

package dfspb;

option go_package = "dfs-project/dfspb";

message CreateFileRequest {
  string filename = 1;
  int64 total_size = 2;
  string username = 3;
  string password = 4;
}

message CreateFileResponse {
  bool success = 1;
  string username = 2;
  map<int32, StripeMetadata> stripes = 3;
}

message AllocateChunkRequest {
  string filename = 1;
  int64 file_size = 2;
}

message ChunkList {
  repeated string chunk_ids = 1;
}

message StripeMetadata {
  int32 stripe_num = 1;
  repeated string chunk_ids = 2;  // [data1, data2, parity]
  repeated string servers = 3;    // [server1, server2, server3]
}

message AllocateChunkResponse {
  map<int32, StripeMetadata> stripes = 1;
}

message GetFileMetadataRequest {
  string filename = 1;
  string username = 2;
  string password = 3;
}

message GetFileMetadataResponse {
  map<int32, StripeMetadata> stripes = 1;
  int64 file_size = 2;
}

message WriteChunkRequest {
  string chunk_id = 1;
  bytes data = 2;
  string checksum = 3;
  string username = 4;
}

message WriteChunkResponse {
  bool success = 1;
}

message ReadChunkRequest {
  string chunk_id = 1;
  string username = 2;
}

message ReadChunkResponse {
  bytes data = 1;
  string checksum = 2;
}

message ForwardChunkRequest {
  string chunk_id = 1;
  bytes data = 2;
  repeated string next_locations = 3;
}

message HeartbeatRequest {
  string address = 1;
}

message HeartbeatResponse {
  bool success = 1;
}

message InventoryRequest {
  string address = 1;
  repeated string chunk_ids = 2;  // Chunks this server currently has
}

message ReconstructionTask {
  string chunk_id = 1;              // The missing chunk to reconstruct
  int32 stripe_num = 2;             // Stripe number
  repeated string other_chunk_ids = 3;  // [chunk1, chunk2] - the 2 available chunks
  repeated string other_servers = 4;    // [server1, server2] - where to get them
  string username = 5;              // username for physical isolation
}

message InventoryResponse {
  repeated string missing_chunks = 1;  // Chunks to reconstruct
  repeated string extra_chunks = 2;    // Chunks to delete (orphaned)
  repeated ReconstructionTask reconstruction_tasks = 3;  // How to reconstruct missing chunks
}

message ConfirmWriteRequest {
  string filename = 1;
  repeated string chunk_ids = 2;
}

message ConfirmWriteResponse {
  bool success = 1;
}

message DeleteFileRequest {
  string filename = 1;
  string username = 2;
  string password = 3;
}

message DeleteFileResponse {
  bool success = 1;
  string message = 2;
}

message DeleteChunksRequest {
  repeated string chunk_ids = 1;  // All chunks to delete on this server
  string username = 2;
}

message DeleteChunksResponse {
  bool success = 1;
  int32 deleted_count = 2;  // How many chunks were successfully deleted
}

message ListFilesRequest {
  string username = 1;
  string password = 2;
}

message ListFilesResponse {
  repeated string filenames = 1;
}

// New messages for folder operations and detailed listing
message CreateFolderRequest {
  string username = 1;
  string folder_path = 2;  // e.g., "documents/photos"
  string password = 3;
}

message CreateFolderResponse {
  bool success = 1;
  string message = 2;
}

message DeleteFolderRequest {
  string username = 1;
  string folder_path = 2;
  string password = 3;
}

message DeleteFolderResponse {
  bool success = 1;
  string message = 2;
}

message MoveFileRequest {
  string username = 1;
  string source_path = 2;      // e.g., "file.pdf" or "folder1/file.pdf"
  string destination_path = 3; // e.g., "folder2/file.pdf"
  string password = 4;
}

message MoveFileResponse {
  bool success = 1;
  string message = 2;
}

message FileMetadata {
  string path = 1;           // Full path: "folder/file.pdf" or "file.pdf"
  int64 size = 2;            // File size in bytes
  int64 upload_time = 3;     // Unix timestamp
  bool is_directory = 4;
}

message ListFilesDetailedRequest {
  string username = 1;
  string folder = 2;    // "" for root, "folder1" for subfolder
  string password = 3;
}

message ListFilesDetailedResponse {
  repeated FileMetadata items = 1;
}

message ReadFileContentRequest {
  string filename = 1;
  string username = 2;
  int64 offset = 3;      // Byte offset to start reading from
  int64 length = 4;      // Number of bytes to read (0 = read all)
  string password = 5;
}

message ReadFileContentResponse {
  bytes data = 1;
  int64 total_size = 2;  // Total file size
}

message AuthenticateRequest {
  string username = 1;
  string password = 2;
  bool is_register = 3;
}

message AuthenticateResponse {
  bool success = 1;
  string message = 2;
}

service MasterServer {
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);
  rpc CreateFile(CreateFileRequest) returns (CreateFileResponse);
  rpc AllocateChunk(AllocateChunkRequest) returns (AllocateChunkResponse);
  rpc GetFileMetadata(GetFileMetadataRequest) returns (GetFileMetadataResponse);
  rpc ReceiveHeartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc ReportInventory(InventoryRequest) returns (InventoryResponse);
  rpc ConfirmWrite(ConfirmWriteRequest) returns (ConfirmWriteResponse);
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc Ping(PingRequest) returns (PingResponse);

  // Folder Operations
  rpc CreateFolder(CreateFolderRequest) returns (CreateFolderResponse);
  rpc DeleteFolder(DeleteFolderRequest) returns (DeleteFolderResponse);
  rpc ListFilesDetailed(ListFilesDetailedRequest) returns (ListFilesDetailedResponse);
  rpc MoveFile(MoveFileRequest) returns (MoveFileResponse);
  rpc ReadFileContent(ReadFileContentRequest) returns (ReadFileContentResponse);
  rpc SyncMetadata(SyncMetadataRequest) returns (SyncMetadataResponse);
}

message SyncMetadataRequest {
  bytes wal_data = 1;
  bytes checkpoint_data = 2;
}

message SyncMetadataResponse {
  bool success = 1;
}

message PingRequest {}
message PingResponse {
  bool active = 1; // Returns true if server is active (not standby)
}

service ChunkServer {
  rpc WriteChunk(WriteChunkRequest) returns (WriteChunkResponse);
  rpc ReadChunk(ReadChunkRequest) returns (ReadChunkResponse);
  rpc ForwardChunk(ForwardChunkRequest) returns (WriteChunkResponse);
  rpc DeleteChunks(DeleteChunksRequest) returns (DeleteChunksResponse);
}