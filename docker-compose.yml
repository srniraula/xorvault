# docker-compose.yml - Defines all containers and how they connect
# Version 3.8 is stable and widely supported
version: '3.8'

# Services = containers that run together
services:
  # Master server container
  master:
    # Build image from our Dockerfile
    build:
      context: .        # Look for Dockerfile in current directory
      dockerfile: Dockerfile
    
    # Container name (easier to reference than auto-generated names)
    container_name: dfs-master
    
    # Hostname inside the Docker network
    hostname: master

    # Command to run when container starts
    command: sh -c "chown -R dfs:dfs /data && exec master"
    
    # Port mapping: host:container
    # Access master at localhost:50051 from your host machine
    ports:
      - "50051:50051"
    
    # Named volume for persistent data
    # Even if container is deleted, data survives
    volumes:
      - ./master-data:/data
    
    # Connect to custom network
    networks:
      - dfs-network
    
    # Environment variables
    environment:
      - DFS_ROLE=master
    
    # Restart policy: always restart if it crashes
    restart: unless-stopped
    
    # Health check to monitor if master is running properly
    healthcheck:
      test: ["CMD", "sh", "-c", "netstat -an | grep 50051 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Chunk Server 1
  chunkserver1:
    build:
      context: .
      dockerfile: Dockerfile
    
    container_name: dfs-chunkserver1
    hostname: chunkserver1
    
    # Pass command-line arguments
    command: sh -c "chown -R dfs:dfs /data && exec chunkserver -port 9001 -storage /data/"
    
    ports:
      - "9001:9001"
    
    volumes:
      - ./chunkserver1-data:/data
    
    networks:
      - dfs-network
    
    environment:
      - DFS_ROLE=chunkserver
      - CHUNK_SERVER_ID=1
      - MASTER_ADDR=master:50051
    
    # Wait for master to be healthy before starting
    depends_on:
      master:
        condition: service_healthy
    
    restart: unless-stopped

  # Chunk Server 2
  chunkserver2:
    build:
      context: .
      dockerfile: Dockerfile
    
    container_name: dfs-chunkserver2
    hostname: chunkserver2
    
    
    command: sh -c "chown -R dfs:dfs /data && exec chunkserver -port 9002 -storage /data/"
    
    ports:
      - "9002:9002"
    
    volumes:
      - ./chunkserver2-data:/data
    
    networks:
      - dfs-network
    
    environment:
      - DFS_ROLE=chunkserver
      - CHUNK_SERVER_ID=2
      - MASTER_ADDR=master:50051
    
    depends_on:
      master:
        condition: service_healthy
    
    restart: unless-stopped

  # Chunk Server 3
  chunkserver3:
    build:
      context: .
      dockerfile: Dockerfile
    
    container_name: dfs-chunkserver3
    hostname: chunkserver3
    
    command: sh -c "chown -R dfs:dfs /data && exec chunkserver -port 9003 -storage /data/"
    
    ports:
      - "9003:9003"
    
    volumes:
      - ./chunkserver3-data:/data
    
    networks:
      - dfs-network
    
    environment:
      - DFS_ROLE=chunkserver
      - CHUNK_SERVER_ID=3
      - MASTER_ADDR=master:50051
    
    depends_on:
      master:
        condition: service_healthy
    
    restart: unless-stopped

  # Web API server – exposes REST endpoints for upload / download / delete
  webserver:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: dfs-webserver
    hostname: webserver

    command: sh -c "exec webserver"

    ports:
      - "8080:8080"

    networks:
      - dfs-network

    environment:
      - DFS_ROLE=webserver
      - MASTER_ADDR=master:50051
      - WEB_API_PORT=8080

    depends_on:
      master:
        condition: service_healthy
      chunkserver1:
        condition: service_started
      chunkserver2:
        condition: service_started
      chunkserver3:
        condition: service_started

    restart: unless-stopped

  # Client container (for running one-off commands)
  client:
    build:
      context: .
      dockerfile: Dockerfile
    
    container_name: dfs-client
    hostname: client
    
    # No command - this service is only used with "docker-compose run"
    # It doesn't run continuously like the servers
    entrypoint: ["/bin/sh"]
    
    # Mount host directory to access files
    # mount . means host directory to container directory /workspace
    # Client can upload files in host directory to system and store downloaded files in same directory
    volumes:
      - .:/workspace
    
    working_dir: /workspace
    
    networks:
      - dfs-network
    
    environment:
      - DFS_ROLE=client
      - MASTER_ADDR=master:50051
    
    # Wait for cluster to be ready
    depends_on:
      master:
        condition: service_healthy
      chunkserver1:
        condition: service_started
      chunkserver2:
        condition: service_started
      chunkserver3:
        condition: service_started

# Networks - create isolated network for containers to communicate
networks:
  dfs-network:
    # Bridge driver creates a private network
    # Containers can reach each other by name (e.g., "master", "chunkserver1")
    driver: bridge
    
    # Custom subnet for predictable IP addresses
    ipam:
      config:
        - subnet: 172.25.0.0/16

# Volumes - persistent storage that survives container restarts
volumes:
  master-data:
    driver: local
  chunkserver1-data:
    driver: local
  chunkserver2-data:
    driver: local
  chunkserver3-data:
    driver: local
