# docker-compose.yml - Defines all containers and how they connect
# Version 3.8 is stable and widely supported
version: '3.8'

# Services = containers that run together
# NOTE: For flexible deployments, master servers are configured via environment variables
# You can run everything on Docker OR on actual machines
# 
# STANDALONE DEPLOYMENT (Mac + Kali VM):
#   1. Kali VM: make run-master-secondary MY_ADDR=192.168.1.20:50052
#   2. Mac (primary): make run-master-primary MY_ADDR=192.168.1.10:50051 SECONDARY_ADDR=192.168.1.20:50052
#   3. Any machine: make run-chunk_server1 MASTER_ADDR=192.168.1.10:50051 SECONDARY_MASTER_ADDR=192.168.1.20:50052
#
# DOCKER DEPLOYMENT (set env vars before running):
#   export PRIMARY_MASTER=192.168.1.10:50051
#   export SECONDARY_MASTER=192.168.1.20:50052
#   docker-compose up
#
services:
  # Chunk Server 1
  chunkserver1:
    build:
      context: .
      dockerfile: Dockerfile
    
    container_name: dfs-chunkserver1
    hostname: chunkserver1
    
    # Use environment variables for flexibility across deployments
    command: sh -c "chown -R dfs:dfs /data && exec chunkserver -port 9001 -storage /data/ -master ${PRIMARY_MASTER:-master-primary:50051} -secondary-master ${SECONDARY_MASTER:-master-secondary:50052}"
    
    ports:
      - "9001:9001"
    
    volumes:
      - ./chunkserver1-data:/data
    
    networks:
      - dfs-network
    
    environment:
      - DFS_ROLE=chunkserver
      - CHUNK_SERVER_ID=1
      - MASTER_ADDR=${PRIMARY_MASTER:-master-primary:50051}
      - SECONDARY_MASTER_ADDR=${SECONDARY_MASTER:-master-secondary:50052}
    
    restart: unless-stopped

  # Chunk Server 2
  chunkserver2:
    build:
      context: .
      dockerfile: Dockerfile
    
    container_name: dfs-chunkserver2
    hostname: chunkserver2
    
    # Use environment variables for flexibility across deployments
    command: sh -c "chown -R dfs:dfs /data && exec chunkserver -port 9002 -storage /data/ -master ${PRIMARY_MASTER:-master-primary:50051} -secondary-master ${SECONDARY_MASTER:-master-secondary:50052}"
    
    ports:
      - "9002:9002"
    
    volumes:
      - ./chunkserver2-data:/data
    
    networks:
      - dfs-network
    
    environment:
      - DFS_ROLE=chunkserver
      - CHUNK_SERVER_ID=2
      - MASTER_ADDR=${PRIMARY_MASTER:-master-primary:50051}
      - SECONDARY_MASTER_ADDR=${SECONDARY_MASTER:-master-secondary:50052}
    
    restart: unless-stopped

  # Chunk Server 3
  chunkserver3:
    build:
      context: .
      dockerfile: Dockerfile
    
    container_name: dfs-chunkserver3
    hostname: chunkserver3
    
    # Use environment variables for flexibility across deployments
    command: sh -c "chown -R dfs:dfs /data && exec chunkserver -port 9003 -storage /data/ -master ${PRIMARY_MASTER:-master-primary:50051} -secondary-master ${SECONDARY_MASTER:-master-secondary:50052}"
    
    ports:
      - "9003:9003"
    
    volumes:
      - ./chunkserver3-data:/data
    
    networks:
      - dfs-network
    
    environment:
      - DFS_ROLE=chunkserver
      - CHUNK_SERVER_ID=3
      - MASTER_ADDR=${PRIMARY_MASTER:-master-primary:50051}
      - SECONDARY_MASTER_ADDR=${SECONDARY_MASTER:-master-secondary:50052}
    
    restart: unless-stopped

  # Client container (for running one-off commands)
  client:
    build:
      context: .
      dockerfile: Dockerfile
    
    container_name: dfs-client
    hostname: client
    
    # No command - this service is only used with "docker-compose run"
    # It doesn't run continuously like the servers
    entrypoint: ["/bin/sh"]
    
    # Mount host directory to access files
    # mount . means host directory to container directory /workspace
    # Client can upload files in host directory to system and store downloaded files in same directory
    volumes:
      - .:/workspace
    
    working_dir: /workspace
    
    networks:
      - dfs-network
    
    environment:
      - DFS_ROLE=client
      - MASTER_ADDR=${PRIMARY_MASTER:-master-primary:50051}
      - SECONDARY_MASTER_ADDR=${SECONDARY_MASTER:-master-secondary:50052}
    
    # Wait for chunk servers to be ready
    depends_on:
      chunkserver1:
        condition: service_started
      chunkserver2:
        condition: service_started
      chunkserver3:
        condition: service_started

# Networks - create isolated network for containers to communicate
networks:
  dfs-network:
    # Bridge driver creates a private network
    # Containers can reach each other by name (e.g., "master", "chunkserver1")
    driver: bridge
    
    # Custom subnet for predictable IP addresses
    ipam:
      config:
        - subnet: 172.25.0.0/16

# Volumes - persistent storage that survives container restarts
volumes:
  master-data:
    driver: local
  chunkserver1-data:
    driver: local
  chunkserver2-data:
    driver: local
  chunkserver3-data:
    driver: local
